<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>(주)도스코 - 비밀번호 변경 (모바일)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap');
    * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6">
  <div class="w-full max-w-md mx-auto pt-4 sm:pt-8">
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-400 text-2xl mb-3 shadow-lg shadow-amber-500/10">
        🔐
      </div>
      <h1 class="text-xl sm:text-2xl font-black tracking-tight text-white">(주)도스코 계정 비밀번호 변경</h1>
      <p class="text-xs text-slate-400 mt-1">현장 QR 스캔 일회용 보안 세션 (유효시간: 5분)</p>
    </div>

    <!-- User Information Card -->
    <div id="user-info-card" class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 mb-5 shadow-xl backdrop-blur-md">
      <div class="flex items-center justify-between text-sm pb-2.5 border-b border-slate-800">
        <span class="text-slate-400 font-medium">대상 사원</span>
        <span id="txt-user-display" class="font-bold text-amber-300">확인 중...</span>
      </div>
      <div class="flex items-center justify-between text-sm pt-2.5">
        <span class="text-slate-400 font-medium">적용 규칙</span>
        <span id="txt-rule-badge" class="px-2 py-0.5 rounded text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700">확인 중</span>
      </div>
      <div id="txt-rule-guide" class="text-xs text-slate-400 mt-2 bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80 leading-relaxed">
        규칙을 불러오는 중입니다...
      </div>
    </div>

    <!-- Password Input Form -->
    <form id="form-reset-pw" onsubmit="submitNewPassword(event)" class="space-y-4">
      <div>
        <label for="inp-new-pw" class="block text-xs font-bold text-slate-300 mb-1.5">새 비밀번호 입력</label>
        <div class="relative">
          <input type="password" id="inp-new-pw" required autocomplete="new-password"
            placeholder="새 비밀번호 입력"
            oninput="validateInputRealtime()"
            class="w-full px-4 py-3.5 rounded-xl bg-slate-900 border border-slate-700 text-white font-mono text-base focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition-all placeholder-slate-600">
          <button type="button" onclick="togglePwVisibility('inp-new-pw', 'btn-vis-1')" id="btn-vis-1"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 text-sm p-1">
            👁️
          </button>
        </div>
      </div>

      <div>
        <label for="inp-new-pw-confirm" class="block text-xs font-bold text-slate-300 mb-1.5">새 비밀번호 확인</label>
        <div class="relative">
          <input type="password" id="inp-new-pw-confirm" required autocomplete="new-password"
            placeholder="새 비밀번호 한번 더 입력"
            oninput="validateInputRealtime()"
            class="w-full px-4 py-3.5 rounded-xl bg-slate-900 border border-slate-700 text-white font-mono text-base focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition-all placeholder-slate-600">
          <button type="button" onclick="togglePwVisibility('inp-new-pw-confirm', 'btn-vis-2')" id="btn-vis-2"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 text-sm p-1">
            👁️
          </button>
        </div>
      </div>

      <!-- Realtime Validation Status -->
      <div id="validation-msg" class="text-xs font-medium px-1 min-h-[20px] transition-colors text-slate-500">
        비밀번호를 입력하세요.
      </div>

      <button type="submit" id="btn-submit" disabled
        class="w-full py-4 rounded-xl bg-amber-500 hover:bg-amber-400 disabled:bg-slate-800 disabled:text-slate-600 disabled:cursor-not-allowed text-slate-950 font-black text-base shadow-lg shadow-amber-500/20 active:scale-[0.98] transition-all cursor-pointer">
        비밀번호 변경 완료
      </button>
    </form>

    <!-- Success Modal / State -->
    <div id="box-success" class="hidden text-center py-8 space-y-4">
      <div class="w-16 h-16 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 text-3xl flex items-center justify-center mx-auto shadow-lg shadow-emerald-500/20 animate-bounce">
        ✓
      </div>
      <h2 class="text-xl font-black text-white">비밀번호가 변경되었습니다!</h2>
      <p id="txt-success-msg" class="text-sm text-slate-300 leading-relaxed px-4">
        현장 공용 PC / 태블릿에서 새 비밀번호로 로그인해주세요.
      </p>
      <div class="pt-4">
        <button onclick="window.close()" class="w-full py-3.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-sm border border-slate-700">
          창 닫기
        </button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="text-center py-4 text-xs text-slate-600 border-t border-slate-900 mt-6">
    &copy; (주)도스코 열처리 시스템 · 정보보안 가드레일 v2.0
  </footer>

  <script>
    var urlParams = new URLSearchParams(window.location.search);
    var token = urlParams.get('token') || '';
    var currentRule = 'WORKER_4DIGIT';
    var targetEmpNo = '';

    // 토큰 메타 확인 및 초기화
    (async function initTokenMeta() {
      if (!token) {
        showError('유효하지 않은 접근입니다. 현장 대시보드의 QR 코드를 다시 스캔하세요.');
        return;
      }
      try {
        var res = await fetch('/api/auth/token-info?token=' + encodeURIComponent(token));
        if (!res.ok) {
          var err = await res.json().catch(function() { return {}; });
          showError(err.message || '유효하지 않거나 만료된 일회용 링크입니다.');
          return;
        }
        var data = await res.json();
        targetEmpNo = data.emp_no || '';
        currentRule = data.pw_rule_type || 'WORKER_4DIGIT';
        document.getElementById('txt-user-display').textContent = (data.display_name || data.emp_no) + ' (' + data.emp_no + ')';
        
        applyRuleGuide(currentRule);
      } catch (e) {
        // Fallback: URL 파라미터나 기본값
        applyRuleGuide('WORKER_4DIGIT');
      }
    })();

    function applyRuleGuide(rule) {
      currentRule = rule;
      var badge = document.getElementById('txt-rule-badge');
      var guide = document.getElementById('txt-rule-guide');
      var inp1 = document.getElementById('inp-new-pw');
      var inp2 = document.getElementById('inp-new-pw-confirm');

      if (rule === 'WORKER_4DIGIT') {
        badge.textContent = '현장 작업자 (4자리 숫자)';
        badge.className = 'px-2 py-0.5 rounded text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40';
        guide.innerHTML = '• <b>숫자 정확히 4자리</b>를 입력하세요.<br>• 사번 및 연속/반복 4자리(예: 1111, 1234)는 불가합니다.';
        inp1.setAttribute('type', 'tel');
        inp1.setAttribute('pattern', '[0-9]*');
        inp1.setAttribute('maxlength', '4');
        inp2.setAttribute('type', 'tel');
        inp2.setAttribute('pattern', '[0-9]*');
        inp2.setAttribute('maxlength', '4');
        inp1.placeholder = '4자리 숫자 (예: 5829)';
        inp2.placeholder = '4자리 숫자 재입력';
      } else if (rule === 'PROD_MGR_8DIGIT') {
        badge.textContent = '현장 관리책임자 (4~8자리 숫자)';
        badge.className = 'px-2 py-0.5 rounded text-xs font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-500/40';
        guide.innerHTML = '• <b>숫자 4자리 ~ 8자리</b>를 입력하세요.<br>• 사번 및 연속/동일 반복숫자는 불가합니다.';
        inp1.setAttribute('type', 'tel');
        inp1.setAttribute('pattern', '[0-9]*');
        inp1.setAttribute('maxlength', '8');
        inp2.setAttribute('type', 'tel');
        inp2.setAttribute('pattern', '[0-9]*');
        inp2.setAttribute('maxlength', '8');
        inp1.placeholder = '4~8자리 숫자 (예: 739201)';
        inp2.placeholder = '숫자 재입력';
      } else {
        badge.textContent = '사무직/임원 (8자리 이상 복합)';
        badge.className = 'px-2 py-0.5 rounded text-xs font-bold bg-purple-500/20 text-purple-300 border border-purple-500/40';
        guide.innerHTML = '• <b>8자리 이상</b> 영문, 숫자, 특수문자 중 <b>2가지 이상 조합</b>을 입력하세요.<br>• 사번이나 아이디를 포함할 수 없습니다.';
        inp1.setAttribute('type', 'password');
        inp1.removeAttribute('pattern');
        inp1.removeAttribute('maxlength');
        inp2.setAttribute('type', 'password');
        inp2.removeAttribute('pattern');
        inp2.removeAttribute('maxlength');
        inp1.placeholder = '8자리 이상 영문/숫자/특수문자 조합';
        inp2.placeholder = '비밀번호 재입력';
      }
    }

    function togglePwVisibility(inputId, btnId) {
      var inp = document.getElementById(inputId);
      var btn = document.getElementById(btnId);
      if (inp.type === 'password' || inp.type === 'tel') {
        inp.type = 'text';
        btn.textContent = '🔒';
      } else {
        inp.type = (currentRule === 'OFFICE_COMPLEX') ? 'password' : 'tel';
        btn.textContent = '👁️';
      }
    }

    function validateInputRealtime() {
      var p1 = document.getElementById('inp-new-pw').value;
      var p2 = document.getElementById('inp-new-pw-confirm').value;
      var msg = document.getElementById('validation-msg');
      var btn = document.getElementById('btn-submit');

      if (!p1) {
        msg.textContent = '비밀번호를 입력하세요.';
        msg.className = 'text-xs font-medium px-1 text-slate-500';
        btn.disabled = true;
        return;
      }

      // Check Rule
      if (currentRule === 'WORKER_4DIGIT') {
        if (!/^\d{4}$/.test(p1)) {
          msg.textContent = '숫자 정확히 4자리를 입력해야 합니다.';
          msg.className = 'text-xs font-medium px-1 text-amber-400';
          btn.disabled = true;
          return;
        }
        if (/^(.)\1{3}$/.test(p1)) {
          msg.textContent = '동일 숫자 4자리 반복은 사용할 수 없습니다.';
          msg.className = 'text-xs font-medium px-1 text-rose-400';
          btn.disabled = true;
          return;
        }
      } else if (currentRule === 'PROD_MGR_8DIGIT') {
        if (!/^\d{4,8}$/.test(p1)) {
          msg.textContent = '숫자 4자리 ~ 8자리를 입력해야 합니다.';
          msg.className = 'text-xs font-medium px-1 text-amber-400';
          btn.disabled = true;
          return;
        }
        if (/^(.)\1+$/.test(p1)) {
          msg.textContent = '동일 숫자 반복은 사용할 수 없습니다.';
          msg.className = 'text-xs font-medium px-1 text-rose-400';
          btn.disabled = true;
          return;
        }
      } else {
        if (p1.length < 8) {
          msg.textContent = '8자리 이상 입력해야 합니다. (현재 ' + p1.length + '자)';
          msg.className = 'text-xs font-medium px-1 text-amber-400';
          btn.disabled = true;
          return;
        }
        var categories = 0;
        if (/[A-Za-z]/.test(p1)) categories++;
        if (/[0-9]/.test(p1)) categories++;
        if (/[^A-Za-z0-9]/.test(p1)) categories++;
        if (categories < 2) {
          msg.textContent = '영문, 숫자, 특수문자 중 2종류 이상을 조합해야 합니다.';
          msg.className = 'text-xs font-medium px-1 text-amber-400';
          btn.disabled = true;
          return;
        }
      }

      // Check confirmation
      if (!p2) {
        msg.textContent = '비밀번호 확인을 입력하세요.';
        msg.className = 'text-xs font-medium px-1 text-slate-400';
        btn.disabled = true;
        return;
      }
      if (p1 !== p2) {
        msg.textContent = '비밀번호 확인이 일치하지 않습니다.';
        msg.className = 'text-xs font-medium px-1 text-rose-400';
        btn.disabled = true;
        return;
      }

      msg.textContent = '✓ 사용 가능한 비밀번호입니다.';
      msg.className = 'text-xs font-medium px-1 text-emerald-400';
      btn.disabled = false;
    }

    async function submitNewPassword(e) {
      e.preventDefault();
      var p1 = document.getElementById('inp-new-pw').value;
      var btn = document.getElementById('btn-submit');
      var msg = document.getElementById('validation-msg');

      btn.disabled = true;
      btn.textContent = '안전하게 암호화 전송 중...';

      try {
        var res = await fetch('/api/auth/mobile-reset-pw', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, new_password: p1 })
        });
        var data = await res.json();
        if (!res.ok) {
          msg.textContent = '오류: ' + (data.message || '비밀번호 변경 실패');
          msg.className = 'text-xs font-medium px-1 text-rose-400';
          btn.disabled = false;
          btn.textContent = '다시 시도';
          return;
        }

        document.getElementById('form-reset-pw').classList.add('hidden');
        document.getElementById('user-info-card').classList.add('hidden');
        document.getElementById('box-success').classList.remove('hidden');
        if (data.message) {
          document.getElementById('txt-success-msg').textContent = data.message;
        }
      } catch (err) {
        msg.textContent = '통신 오류가 발생했습니다. (' + err.message + ')';
        msg.className = 'text-xs font-medium px-1 text-rose-400';
        btn.disabled = false;
        btn.textContent = '다시 시도';
      }
    }

    function showError(errText) {
      document.getElementById('form-reset-pw').classList.add('hidden');
      var card = document.getElementById('user-info-card');
      card.innerHTML = '<div class="text-rose-400 font-bold text-center py-4">⚠️ ' + errText + '</div>';
    }
  </script>
</body>
</html>
